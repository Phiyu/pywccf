[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pywccf"
version = "1.0.0"
description = "Cosmic-web cross-correlation functions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hongfei Yu", email = "yuhongfei@mail.ustc.edu.cn" },
  { name = "Huiyuan Wang", email = "whywang@ustc.edu.cn" },
]
keywords = ["cosmology", "cosmic web", "tidal field", "dark matter halos",
            "correlation function", "assembly bias"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
notebook = ["matplotlib>=3.7", "jupyter"]
test = ["pytest", "numba>=0.57"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
